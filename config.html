<!DOCTYPE html>
<html lang="es">
<head>
  <!--Permitir caracteres especiales-->
  <meta charset="UTF-8">
  <!--viewport para ancho de pantalla de los dispositivos y ajustar el zoom por defecto al 100%-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--Metadato de la descripción de la página-->
  <meta name="description" content="Configuración de la habitación y sensores Smart Room">
  <!--Título de la página-->
  <title>Smart Room Project - Configuración</title>
  <!--Enlazamos con la hoja de estilos-->
  <link rel="stylesheet" href="css/iroom.css">
</head>
<body>
  <!-- Encabezado principal -->
  <header>
    <h1>Smart Room Project</h1>
  </header>

  <!--Menú de navegación y saludo de usuario con la clase menu-container para reconocerlo en la hoja de estilos-->
  <div class="menu-container">
    <!--Ayudamos al usuario a navegar por la página y a reconocer el menu de navegacion-->
    <nav aria-label="Menu principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="config.html">Configuración</a></li>
        <li><a href="minombre.html">Mi Perfil</a></li>
      </ul>
    </nav>
    <!--Complemento para información adicional-->
    <aside id="info-aside">Bienvenido a la configuración</aside>
  </div>
  
  <main>
    <!--Con form creamos un formulario con el cual pediremos datos al usuario y los enviará de forma local al navegador mediante el script-->
    <!--action sirve para especificar la URL a la que se enviarán los datos del formulario-->
    <!--method sirve para especificar el metodo de peticion de los datos, POST o GET, post datos sensibles-->
    <!--id sirve para identificar el formulario y poder referenciarlo en el script-->
    <!--style sirve para aplicar estilos al formulario-->
    <form action="datos.js" method="POST" id="config-form" style="width: 100%;" novalidate>
      <!--Creamos el contenedor del formulario-->
      <div class="form-container">
        
        <!--Columna izquierda: Datos de la habitación-->
        <!--Creamos un fieldset para agrupar los elementos del formulario-->
        <fieldset class="card">
          <!--Legend para el encabezado de los elementos del formulario-->
          <h2>Datos de la habitación</h2>
          
          <!--p lo usamos para definir un parrafo de texto-->
          <!--En este caso es el parrafo para introducir el país-->
          <p>
            <!--label sirve para atribuir un nombre a un elemento del formulario-->
            <!--En este caso le atribuimos country al parametro pais para reconocerlo mas tarde-->
            <label for="country">País:</label><br>  <!--br es para hacer un salto de línea-->
            <!--input lo usamos para crear un campo de entrada-->
            <!--type especifica el tipo de campo de entrada, en este caso de texto-->
            <!--id sirve para asociar el label con el input-->
            <!--name sirve para definir el identificador con el que viajará el dato en la petición HTTP-->
            <!--list sirve para asociar el input con el datalist-->
            <!--placeholder sirve para las sugerencias de entrada-->
            <!--required hace obligatorio que se rellene el campo antes de enviar el formulario-->
            <input type="text" id="country" name="country" list="country-list" placeholder="Seleccione o escriba..." required>
            <!--Creamos el datalist que pide la practica, sirve para crear una lista de opciones predefinidas-->
            <!--Debe llevar el identificador que hemos introducido en el input-->
            <datalist id="country-list">
              <!--Definimos las posibles opciones-->
              <option value="España">
              <option value="Francia">             
              <option value="Portugal">            
              <option value="Italia">
              <option value="Alemania">
            </datalist>
          </p>
          
          <p>
            <label for="city">Ciudad:</label><br>
            <input type="text" id="city" name="city" required>
          </p>
          
          <p>
            <label for="gps">Localización (GPS):</label><br>
            <input type="text" id="gps" name="gps" placeholder="Ej: 40.5126° N, 3.3496° O" required>
          </p>
          
          <!--En este caso, el type es una url por lo que solo acepta URLs válidas-->
          <p>
            <label for="map-url">Mapa (URL):</label><br>
            <input type="url" id="map-url" name="map_url" placeholder="https://maps.google.com/..." required>
          </p>
          <!--En este caso, el type es un archivo por lo que solo acepta archivos de imagen-->
          <p>
            <label for="photo">Foto:</label><br>
            <input type="file" id="photo" name="photo" accept="image/*" required>
          </p>

          <!----PRACTICA2 2----->

          <!--Parrafo para el nuevo campo de temperatura actual-->
          <p>
            <!--Etiqueta vinculada al identificador del campo de temperatura actual-->
            <label for="current-temp">Temperatura actual (ºC):</label><br>
            <!--Campo de entrada numerico con pasos decimales y marcado como obligatorio-->
            <input type="number" id="current-temp" name="current_temp" step="0.1" placeholder="Ej: 24.5" required>
          </p>
          
          <!--Parrafo para la contraseña con el indicador de longitud-->
          <p>
            <!--Etiqueta vinculada al campo de contraseña-->
            <label for="password">Contraseña:</label><br>
            <!--Campo de entrada protegido por ser una contraseña-->
            <input type="password" id="password" name="password" required>
          </p>

          <!--Contenedor general para el indicador de la contraseña-->
          <div class="password-indicator-container">
            <!--Añadimos el texto orientativo que indica la longitud actual y su evaluacion-->
            <span id="pwd-feedback-text">Evaluación de longitud: 0 caracteres</span>
            <!--Contenedor que sirve de base gris para la barra de progreso-->
            <div class="password-meter-bar">
              <!--Barra interna coloreada cuyo ancho y color varian segun el script-->
              <div id="pwd-meter-fill" class="password-meter-progress"></div>
            </div>
          </div>
          
          
          <!--Por ultimo creamos el botón de envío del formulario-->
          <p style="margin-top: 15px;">
            <button type="submit" id="btn-submit">Enviar datos</button>
          </p>
        </fieldset>
        
        <!--Columna derecha: Sensores y alertas-->
        <!--Al igual que antes, creamos un fieldset para organizar los elementos, en este caso de los sensores y alertas-->
        <fieldset class="card">
          <h2>Seleccione los sensores</h2>
          
          <!--Creamos un checkbox para cada sensor de forma que el usuario pueda seleccionar los que le interesen-->
          <p>
            <!--Cuando usamos checkbox, debemos asginar el mismo name a todos para agrupar las elecciones en un solo array-->
            <!--Checked sirve para marcar el checkbox por defecto-->
            <!--En este caso, el value es el valor que se enviará al servidor cuando el checkbox esté marcado-->
            <input type="checkbox" id="sensor-temp" name="sensors" value="temperatura" checked>
            <label for="sensor-temp">Temperatura</label>
          </p>
          <p>
            <input type="checkbox" id="sensor-hum" name="sensors" value="humedad" checked>
            <label for="sensor-hum">Humedad</label>
          </p>
          <p>
            <input type="checkbox" id="sensor-sound" name="sensors" value="sonido" checked>
            <label for="sensor-sound">Nivel de sonido</label>
          </p>
          <p>
            <input type="checkbox" id="sensor-light" name="sensors" value="luz" checked>
            <label for="sensor-light">Nivel de luz</label>
          </p>
          <p>
            <input type="checkbox" id="sensor-mov" name="sensors" value="movimiento" checked>
            <label for="sensor-mov">Movimiento</label>
          </p>
          
          <!--hr sirve para respresentar visualmente una línea horizontal-->
          <!--La línea la he configurado para separar los checkox de las alertas, simplemente es por estética-->
          <hr style="margin: 15px 0; border: 0; border-top: 1px solid #d1d5db;">
          
          <!--Introducimos el titulo de las alertas que en este caso no creamos un legend porque queda mejor de esta manera, pura estetica-->
          <!--Ademas no se permite mas de un legend por fieldset-->
          <h3 style="color: #111111; margin-bottom: 10px;">Configure alertas</h3>
          
          <!--Para este input usamos un input de tipo number que ademas permite especificar un valor predeterminado, un valor mínimo, máximo y el paso a paso-->
          <!--Lo he configurado para que vaya de 0.5 en 0.5-->
          <p>
            <label for="temp-max">Temperatura máxima (ºC):</label><br>
            <input type="number" id="temp-max" name="temp_max" min="-20" max="45" step="0.5" value="30">
          </p>
          <!--Hacemos lo mismo para la temperatura mínima-->
          <p>
            <label for="temp-min">Temperatura mínima (ºC):</label><br>
            <input type="number" id="temp-min" name="temp_min" min="-20" max="45" step="0.5" value="15">
          </p>

          <!--Ahora cremaos un contenedor para mostrar la diferencia térmica-->
          <!--Esta diferencia se calcula con un script JavaScript-->
          <!--El contendor será una especie de caja de un color diferente al fondo para que se diferencie la cual tendrá un borde en la derecha roja y el resultado tambien saldrá en rojo-->
          <!--Todo esto es estético-->
          <div style="margin-top: 15px; 
            padding: 10px; 
            background-color: #f8f8f8; 
            border-radius: 4px; 
            border-left: 4px solid #b91c1c;">

            <strong>Diferencia térmica: </strong>
            <!--Creamos el elemento span para mostrar el resultado y poder manipularlo con JavaScript gracias al id-->
            <output id="temp-diff" for ="temp-max temp-min"
              style="font-weight: bold; 
              color: #b91c1c;">
              15.0 °C
            </output>
          </div>
        </fieldset>

      </div>
    </form>
  </main>
  
  <footer>
    <p>Universidad de Alcalá</p>
  </footer>

  <!-----PRACTICA 2 ----->
  <!--Contenedor prncipal para oscurecer la pantalla de fondo cuando hay una ventana modal-->
  <div id="custom-modal" class="modal-overlay" style="display: none";>
    <!--Cuadro blanco del dialogo centrado-->
    <div class="modal-box">
      <h3 id="modal-title">Aviso</h3>
      <!--Parrafo donde el script insertará los mensajes de validacion-->
      <p id="modal-message"></p>
      <!--Boton para cerrar la ventana modal y continuar-->
      <button type="button" id="modal-accept-btn">Aceptar</button>
    </div>
  </div>

  <script>
    //El primer lugar, recuperamos y mostraros el nombre guardado en localStorage para personalizar la experiencia del usuario
    const savedName = localStorage.getItem('fname');
    if (savedName) {
      document.getElementById('info-aside').textContent = `Usuario: ${savedName}`;
    }

    //En segundo lugar tenemos que recuperar los elementos del DOM para poder manipularlos con JavaScript
    const tempMax = document.getElementById('temp-max');
    const tempMin = document.getElementById('temp-min');
    const tempDiff = document.getElementById('temp-diff');
    
    //Ahora creamos la función que calculará la diferencia térmica y la mostrará en el contenedor correspondiente
    function actualizarDiferencia() {
      //Definimos max y min con float por los decimales y parseFloat para convertir el valor del input a número
      const max = parseFloat(tempMax.value);
      const min = parseFloat(tempMin.value);
      
      //En el caso de que el usuario introduzca un valor no numerico mostramos un mensaje de error en vez de el resultado, ademas lo hacemos en rojo para que se vea mejor
      if (isNaN(max) || isNaN(min)) {
        tempDiff.textContent = "Introduzca valores válidos";
        tempDiff.style.color = "#b91c1c";
        return;
      }
      
      //Si la temperatura máxima es menor que la mínima, mostramos un mensaje de error y no calculamos la diferencia
      if (max < min) {
        tempMax.setCustomValidity("La temperatura máxima debe ser mayor o igual que la mínima");
        tempDiff.textContent = "Error: Máxima inferior a mínima";
        tempDiff.style.color = "#b91c1c";
      } 
      //En el caso de que todo este correcto, calulamos la diferencia y la mostramos
      else {
        tempMax.setCustomValidity("");
        const diff = (max - min).toFixed(1);
        tempDiff.textContent = `${diff} °C`;
      }
    }
    
    //Por ultimo añadimos los event listener a los inputs de la temperatura máxima y mínima para que cada vez que el usuario cambie el valor se actualice la diferencia en tiempo real
    tempMax.addEventListener('input', actualizarDiferencia);
    tempMin.addEventListener('input', actualizarDiferencia);

    //----PRACTICA 2----
    //Lo primero es definir los elementos que vamos a usar en las funciones

    //Lista oficial de los paises permitidos como entrada del usuario
    const validCountries = ["España", "Francia", "Portugal", "Italia", "Alemania"];

    //Contenedor general oscuro de la ventana modal
    const modal = document.getElementById('custom-modal');

    //Elemento h3 del titulo de la ventana modal
    const modalTitle = document.getElementById('modal-title');

    //Parrafo donde se escriben los mensajes de la ventana modal
    const modalMessage = document.getElementById('modal-message');

    //Boton de aceptar de la ventana modal
    const modalAcceptBtn = document.getElementById('modal-accept-btn');

    //Variable para almacenar una accion opcional a ejecutar cuando el usuario pulsa aceptar
    let modalCallback = null;

    //Funcion para desplegar la ventana modal cuado se necesite
    function mostrarModal(titulo, mensaje, onAccept = null){
      //Asignamos el texto  del titulo recibido por parametro
      modalTitle.textContent = titulo;
      //Asignamos el mensaje de errores recibidos por parametro
      modalMessage.textContent = mensaje;
      //Guardamos la funcion callback si se necesita realizar una accion al aceptar
      modalCallback = onAccept;
      //Mostramos la ventana modal aplicando flexbox para centrarla
      modal.style.display = 'flex';
    }

    //Creamos un escuchador apuntando al boton de aceptar dentro de la ventana modal
    if (modalAcceptBtn) {
      modalAcceptBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        if (typeof modalCallback === 'function') {
          const action = modalCallback;
          modalCallback = null;
          action();
        }
      });
    }
    
    //Cuando el usuario pulsa el boton, ocultamos la ventana modal
    modal.style.display = 'none';
    //Verificamos si se habia programado una accion al aceptar
    if (typeof modalCallback === 'function') {
      //Almacenamos temporalmente la accion a ejecutar
      const action = modalCallback;
      //Limpiamos la variable para futuras llamadas
      modalCallback = null;
      //Ejecutamos la accion
      action();
    }

    //Ahora vamos a diseñar el indicador orientativo de la longitud de la contraseña
    //Primero obtenemos la referencia del campo de entrada de la contraseña
    const pwdInput = document.getElementById('password');

    //Obtenemos el texto informativo donde se muestra la longitud
    const pwdText = document.getElementById('pwd-feedback-text');

    //Obtenemos la barra interna de color
    const pwdFill = document.getElementById('pwd-meter-fill');

    //Creamos un escuchador en el evento input para actualizar el medidor en tiempo real segun el usuario va tecleando
    pwdInput.addEventListener('input', () => {
      //Calculamos la cantidad de caracteres introducidos en ese movimiento
      const len = pwdInput.value.length;
      //Variable en el que guardamos el estado en el que se encuentra el usuario
      let estado = "";
      //Color por defecto en rojo
      let color = "#ef4444";
      //Ancho por defecto de la barra al inicio
      let ancho = "0%";
      
      //Ahora realizamos las comprobaciones para poder cambiar el estado y el texto que indica en que punto se encuentra el usuario
      //Comprobamos si el campo esta completamente vacio
      if (len === 0){
        ancho = "0%"; //Barra de longitud al 0%
        estado = "0 caracteres"; //Texto o estado
      }
      else if (len < 6){
        ancho = "30%"; //Menos de 6 caracteres = longitud baja
        color = "#ef4444" //Color rojo para advertir
        estado = "Demasiado débil (<6 caracteres)"; //Texto o estado
      }
      else if (len < 9){
        ancho = "65%"; //Entre 6 y 8 caracteres = logitud mediante
        color = "#f59e0b" //Color naranja para advertir de que aun no es valida
        estado = "Débil (<9 caracteres)";
      }
      else{
        ancho = "100%"; //9 caracteres o mas = longitud permitida
        color = "#10b981" //Color verde para indicar que ya es valida
        estado = "Adecuada (>9 caracteres)";
      }

      //Aplicamos el nuevo ancho de la barra de color
      pwdFill.style.width = ancho;
      //Aplicamos el nuevo color de la barra
      pwdFill.style.backgroundColor = color;
      //Actualizamos el mensaje indicando el estado de la comprobaciones
      pwdText.textContent = `Comprobación de longitud: ${len} (${estado})`;
    });

      //Ahora pasamos a la validacion del formulario y el control de errores y advertencias
      //Primero obtenemos las referencia del formulario
      const formConfig = document.getElementById('config-form');

      //Interceptamos el evento de envío del formulario
      formConfig.addEventListener('submit', (e) => {
        //Detenemos el envío automático del navegador para realizar la comprobación manual
        e.preventDefault();

        //Creamos un array donde acumularemos los textos de los errores bloqueantes
        const errores = [];
        //Variable para guardar el mensaje de advertencia térmica si ocurre
        let advertenciaTemp = null;
        
        //---Comprobacion: Campo Country---

        //Obtenemos la referencia al campo país
        const countryInput = document.getElementById('country');
        //Eliminamos espacios a los extremos y convertimos a minúsculas para comparar
        const countryVal = countryInput.value.trim().toLowerCase();

       //Comprobamos si el campo ha quedado vacío
        if (!countryVal) {
          //Añadimos el error correspondiente al array
          errores.push("Error: El campo país no puede estar vacío.");
        } 
        //Comprobamos que, como no esta vacio, coincide con los permitidos
        else{
          const coincide = validCountries.some(pais => pais.toLowerCase() === countryVal);
          // Si no se encuentra en la lista, agregamos el error de país erróneo
          if (!coincide) {
            errores.push("Error: El país debe ser uno de los países admitidos.");
          }
        }
        
        //---Comprobacion de la contraseña---

        if (pwdInput.value.length < 9){
          errores.push("Error: La contraseña debe tener al menos 9 caracteres");
        }
        
        //---Comprobacion de la temperatura actual---

        //Obtenemos la referencia al campo de temperatura actual
        const curTempInput = document.getElementById('current-temp');
        //Convertimos el valor introducido a formato numérico con decimales
        const curTempVal = parseFloat(curTempInput.value);

       //Comprobamos si el campo está vacío o no es un número válido
       if (curTempInput.value.trim() === "" || isNaN(curTempVal)) {
          errores.push("Error: Debe introducir una temperatura actual numérica válida.");
       } 
       else if (curTempVal < 22 || curTempVal > 26) {
         //Si el valor numérico queda fuera del rango [22, 26], generamos advertencia no bloqueante
         advertenciaTemp = `Aviso: La temperatura actual (${curTempVal} °C) está fuera del intervalo inclusivo de 22 a 26 °C.`;
       }

       // --- Gestión de resultados en una ÚNICA ventana modal ---
        //Verificamos si existen errores bloqueantes acumulados
        if (errores.length > 0) {
          //Mostramos todos los errores juntos separados por un salto de línea en una única ventana
          mostrarModal("Datos incorrectos", errores.join("\n"));
          //Detenemos la ejecución sin enviar los datos
          return;
        }

       //Si no hay errores pero existe advertencia de temperatura fuera de rango
        if (advertenciaTemp) {
          //Mostramos la advertencia pero permitimos continuar tras aceptar
          mostrarModal("Advertencia", `${advertenciaTemp}\n\nEsta advertencia no impedirá registrar la lectura.`, () => {
            //Acción al pulsar Aceptar: enviamos el formulario
            formConfig.submit();
          });
        } 
        
        else {
          //Caso de éxito total sin errores ni advertencias
          mostrarModal("Registro correcto", "Todos los campos son válidos. Procesando datos...", () => {
            //Enviamos el formulario
            formConfig.submit();
          });
        }
     });
  

  </script>

</body>
</html>
